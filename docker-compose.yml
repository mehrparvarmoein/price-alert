services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wallgold-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - postgres
      - redis
    networks:
      - wallgold

  nginx:
    image: nginx:1.27-alpine
    container_name: wallgold-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - wallgold

  postgres:
    image: postgres:17-alpine
    container_name: wallgold-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wallgold
      POSTGRES_USER: wallgold
      POSTGRES_PASSWORD: secret
    ports:
      - "54321:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wallgold

  redis:
    image: redis:7-alpine
    container_name: wallgold-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "63791:6379"
    volumes:
      - redis_data:/data
    networks:
      - wallgold

  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    restart: unless-stopped
    command: php artisan horizon
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - redis
    networks:
      - wallgold
      

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    depends_on:
      - postgres
      - redis
    networks:
      - wallgold

networks:
  wallgold:

volumes:
  postgres_data:
  redis_data: